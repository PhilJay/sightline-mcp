name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: claude plugin validate . --strict

      - name: Check skill front matter
        run: |
          status=0
          for dir in skills/*; do
            id=$(basename "$dir")
            front=$(awk 'NR==1 && $0=="---" {inside=1; next} inside && $0=="---" {exit} inside' "$dir/SKILL.md")
            if ! grep -qx "name: $id" <<< "$front"; then
              echo "::error file=$dir/SKILL.md::name must be $id"; status=1
            fi
            if ! grep -qE '^description: *[^ ]' <<< "$front"; then
              echo "::error file=$dir/SKILL.md::description is missing or empty"; status=1
            fi
          done
          exit $status
